name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Also run by release.yml before publishing.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_call' }}

jobs:
  checks:
    name: Generated files and package contents
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # custom-elements.json and vscode.html-custom-data.json must match the JSDoc.
      - run: npm run check:generated
      # Lists the files each package would publish (prepack inlines gc-base).
      - run: npm pack --dry-run --workspaces
      - run: git diff --exit-code

  test:
    name: Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project=${{ matrix.browser }}
      # Same tests on the files as published, with gc-base inlined.
      - name: Tests on the packed files
        if: matrix.browser == 'chromium'
        run: |
          npm run prepack --workspaces --if-present
          npx playwright test --project=chromium
          npm run postpack --workspaces --if-present
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.browser }}
          path: test-results/
          retention-days: 7
